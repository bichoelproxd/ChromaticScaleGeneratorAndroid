name: Build APK

# Compila el APK de Android (armeabi-v7a y arm64-v8a) con el motor de Praat del codigo fuente de Parselmouth.
#
# Genera 3 APK:
#   - app-universal-release.apk     -> contiene armeabi-v7a y arm64-v8a (sirve en cualquier telefono)
#   - app-arm64-v8a-release.apk     -> solo telefonos de 64 bits (la mayoria de los actuales)
#   - app-armeabi-v7a-release.apk   -> solo telefonos de 32 bits
#
# Se ejecuta en cada push a main/master, en pull requests, a mano (Actions > Build APK > Run workflow)
# y al subir una etiqueta v* (por ejemplo v1.0), que ademas publica un Release con los APK.

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_PLATFORM: "android-35"
  ANDROID_BUILD_TOOLS: "35.0.0"
  ANDROID_NDK: "27.2.12479018"
  ANDROID_CMAKE: "3.22.1"

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write # solo se usa para publicar el Release cuando se sube una etiqueta v*

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Descargar el codigo fuente de Parselmouth/Praat
        run: bash scripts/fetch_praat.sh

      # Los runners de GitHub (ubuntu-24.04) ya traen el SDK de Android en $ANDROID_HOME
      # con sdkmanager, asi que solo se instalan las piezas que necesita este proyecto.
      - name: Instalar NDK, CMake y plataforma de Android
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          fi
          echo "SDK: $SDK"
          echo "sdkmanager: $SDKMANAGER"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK" --install \
            "platforms;${ANDROID_PLATFORM}" \
            "build-tools;${ANDROID_BUILD_TOOLS}" \
            "ndk;${ANDROID_NDK}" \
            "cmake;${ANDROID_CMAKE}"

      # ccache guarda lo ya compilado de Praat: asi las siguientes ejecuciones tardan mucho menos.
      - name: Configurar ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: praat-ndk-${{ env.ANDROID_NDK }}
          max-size: 1G

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK (release)
        run: ./gradlew --no-daemon assembleRelease -PuseCcache --stacktrace

      - name: Comprobar que los APK contienen las dos arquitecturas
        run: |
          set -euo pipefail
          ls -lh app/build/outputs/apk/release/
          check() { # check <apk> <abi...>
            local apk="$1"; shift
            for abi in "$@"; do
              unzip -l "$apk" | grep -q "lib/${abi}/libchromaticpraat.so" \
                || { echo "::error::Falta lib/${abi}/libchromaticpraat.so en ${apk}"; exit 1; }
            done
          }
          check app/build/outputs/apk/release/app-universal-release.apk armeabi-v7a arm64-v8a
          check app/build/outputs/apk/release/app-arm64-v8a-release.apk arm64-v8a
          check app/build/outputs/apk/release/app-armeabi-v7a-release.apk armeabi-v7a
          echo "OK: los APK contienen libchromaticpraat.so para armeabi-v7a y arm64-v8a"

      - name: Resumen
        run: |
          {
            echo "## APK generados"
            echo
            echo '| Archivo | Tamano |'
            echo '| --- | --- |'
            for f in app/build/outputs/apk/release/*.apk; do
              echo "| $(basename "$f") | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Subir los APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ChromaticScaleGenerator-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publicar Release con los APK (solo etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
